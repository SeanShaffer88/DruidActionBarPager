name: Verify and package addon
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify tag points to checked source
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: lupa==2.8
      - run: python -B tests/run.py
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Build canonical package
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="v$(sed -n 's/^## Version: //p' DruidActionBarPager/DruidActionBarPager.toc)"
          fi
          python -B tools/package_release.py --tag "$tag" --output "$RUNNER_TEMP/addon-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addon-release-files
          path: ${{ runner.temp }}/addon-release/
          if-no-files-found: error
          compression-level: 0
  windows-parity:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon-release-files
          path: posix
      - name: Compare canonical Windows and POSIX bytes
        shell: pwsh
        run: |
          $version = (Select-String '^## Version: (.+)$' DruidActionBarPager/DruidActionBarPager.toc).Matches.Groups[1].Value
          python -B tools/package_release.py --tag "v$version" --output "$env:RUNNER_TEMP/parity"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = (Get-Content posix/SHA256SUMS.txt -Raw).Trim()
          $actual = (Get-Content "$env:RUNNER_TEMP/parity/SHA256SUMS.txt" -Raw).Trim()
          if ($actual -cne $expected) { throw 'Canonical archive bytes differ across platforms.' }
  publish:
    if: github.event_name != 'pull_request'
    needs: [verify, windows-parity]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: addon-release-files
          path: dist
      - name: Publish verified assets and read back exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing release must match; assets will not be replaced.'
          else
            gh release create "$TAG" "dist/DruidActionBarPager-${TAG#v}.zip" dist/SHA256SUMS.txt \
              --verify-tag --title "DruidActionBarPager ${TAG#v}" --notes-file dist/release-notes.md
          fi
          mkdir readback
          gh release download "$TAG" --dir readback --pattern 'DruidActionBarPager-*.zip' --pattern SHA256SUMS.txt
          cmp dist/SHA256SUMS.txt readback/SHA256SUMS.txt
          (cd readback && sha256sum -c SHA256SUMS.txt)
          cmp "dist/DruidActionBarPager-${TAG#v}.zip" "readback/DruidActionBarPager-${TAG#v}.zip"
